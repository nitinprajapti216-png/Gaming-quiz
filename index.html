<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padhai Quiz App</title>
    <style>
        body { background: #111; color: white; font-family: Arial, sans-serif; text-align: center; padding: 10px; margin: 0; }
        .box { background: #222; padding: 20px; border-radius: 15px; max-width: 600px; width: 90%; margin: 20px auto; box-shadow: 0 4px 15px rgba(0, 255, 255, 0.1); }
        h1 { color: #00ffff; font-size: 26px; }
        #timer-text { font-size: 22px; color: #ff3333; font-weight: bold; margin-bottom: 15px; }
        button, .option-btn { display: block; width: 100%; padding: 18px; margin: 15px 0; border: 0; border-radius: 10px; font-size: 20px; cursor: pointer; background: white; color: black; font-weight: bold; box-sizing: border-box; }
        button:hover, .option-btn:hover { opacity: .8; }
        #result { font-size: 24px; margin-top: 20px; }
        .rank-badge { display: inline-block; font-size: 24px; color: #ff007f; font-weight: bold; margin-top: 15px; background: #333; padding: 10px; border-radius: 8px; border: 1px dashed #ff007f; }
        .screen { display: none; }
        .active { display: block; }
        #question { font-size: 22px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- HOME SCREEN -->
    <div id="home-screen" class="box screen active">
        <h1>📚 Padhai Quiz App</h1>
        <p style="color: #aaa; font-size: 16px;">Padhai se jude sawaalo ke sahi jawab dein aur apni rank jaanein!</p>
        <button onclick="startQuiz()" style="background: #00ffff; color: black;">🎮 Play Quiz</button>
    </div>

    <!-- GAME PLAY SCREEN -->
    <div id="game-screen" class="box screen">
        <div id="timer-text">⏳ Time Left: 15s</div>
        <div id="question">Sawaal yahan aayega...</div>
        <div id="options-container"></div>
        <div id="result"></div>
    </div>

    <!-- SCORE SCREEN -->
    <div id="score-screen" class="box screen">
        <div id="score-details"></div>
        <button onclick="showScreen('home-screen')" style="background: #00ffff; color: black; margin-top: 20px;">🔄 Main Menu / Replay</button>
    </div>

    <script>
        // शुद्ध पढ़ाई और ज्ञान से भरपूर 10 सवाल
        const quizDataMaster = [
            { q: "Bharat ki Rajdhani kya hai?", options: ["Mumbai", "Delhi", "Kolkata", "Chennai"], correct: 1 },
            { q: "Computer ka brain kise kehte hain?", options: ["RAM", "Hard Disk", "CPU", "Monitor"], correct: 2 },
            { q: "Human body (Insaan ke sharir) mein kul kitni haddiyan hoti hain?", options: ["206", "300", "108", "250"], correct: 0 },
            { q: "Paani ka scientific formula kya hota hai?", options: ["CO2", "H2O", "O2", "NaCl"], correct: 1 },
            { q: "Hamare Sourmandal (Solar System) ka sabse bada grah kaun sa hai?", options: ["Prithvi (Earth)", "Mangal (Mars)", "Bhaspati (Jupiter)", "Shani (Saturn)"], correct: 2 },
            { q: "Suryamani (Sunlight) se humein kaun sa Vitamin milta hai?", options: ["Vitamin A", "Vitamin B", "Vitamin C", "Vitamin D"], correct: 3 },
            { q: "Sabse choti Abhajya Sankhya (Smallest Prime Number) kaun si hai?", options: ["0", "1", "2", "3"], correct: 2 },
            { q: "Kagaz (Paper) ka avishkar sabse pehle kis desh mein hua tha?", options: ["Bharat", "China", "America", "Japan"], correct: 1 },
            { q: "Prithvi par sabse bada Mahasagar (Largest Ocean) kaun sa hai?", options: ["Prashant Mahasagar (Pacific)", "Hind Mahasagar", "Atlantic Mahasagar", "Arctic Mahasagar"], correct: 0 },
            { q: "Kshetrafal (Area) ke hisab se Bharat ka sabse bada Rajya kaun sa hai?", options: ["Uttar Pradesh", "Madhya Pradesh", "Rajasthan", "Maharashtra"], correct: 2 }
        ];

        let quizData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let timeLeft = 15;
        let timerInterval;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function startQuiz() {
            quizData = [...quizDataMaster];

            // Shuffling (सवालों को मिक्स करना)
            for (let i = quizData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [quizData[i], quizData[j]] = [quizData[j], quizData[i]];
            }

            currentQuestionIndex = 0;
            score = 0;
            showScreen('game-screen');
            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById("result").innerHTML = "";
            clearInterval(timerInterval);

            if (currentQuestionIndex >= quizData.length) {
                showFinalScore();
                return;
            }

            let currentQuiz = quizData[currentQuestionIndex];
            document.getElementById("question").innerHTML = `${currentQuestionIndex + 1}. ${currentQuiz.q}`;

            let optionsHtml = "";
            currentQuiz.options.forEach((option, index) => {
                optionsHtml += `<button class="option-btn" onclick="checkAnswer(${index})">${option}</button>`;
            });

            document.getElementById("options-container").innerHTML = optionsHtml;

            timeLeft = 15;
            document.getElementById("timer-text").innerHTML = `⏳ Time Left: ${timeLeft}s`;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer-text").innerHTML = `⏳ Time Left: ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    disableButtons();
                    document.getElementById("result").innerHTML = "⏰ Time Out! Agla sawaal aa raha hai...";
                    currentQuestionIndex++;
                    setTimeout(loadQuestion, 2000);
                }
            }, 1000);
        }

        function disableButtons() {
            let buttons = document.getElementsByClassName("option-btn");
            for (let button of buttons) {
                button.disabled = true;
                button.style.opacity = "0.6";
                button.style.cursor = "default";
            }
        }

        function checkAnswer(selectedIndex) {
            clearInterval(timerInterval);
            disableButtons();

            let currentQuiz = quizData[currentQuestionIndex];

            if (selectedIndex === currentQuiz.correct) {
                score++;
                document.getElementById("result").innerHTML = "✅ Sahi jawab!";
            } else {
                let correctOptionText = currentQuiz.options[currentQuiz.correct];
                document.getElementById("result").innerHTML = `❌ Galat jawab! Sahi jawab hai: <b>${correctOptionText}</b>`;
            }

            currentQuestionIndex++;
            setTimeout(loadQuestion, 2000);
        }

        function showFinalScore() {
            showScreen('score-screen');
            
            let message = ""; 
            let rank = "";
            let totalQ = quizData.length;

            if (score === totalQ) {
                message = "Shabash! Aapne saare jawab sahi diye! 🥇";
                rank = "Your Rank: Albert Einstein 👑 (Mahagyani)";
            } else if (score >= (totalQ * 0.7)) {
                message = "Bahut Achha Prayas! 👍";
                rank = "Your Rank: Topper Student 📝 (Bahut Badhiya)";
            } else if (score >= (totalQ * 0.4)) {
                message = "Thoda aur padhne ki zaroorat hai! 📖";
                rank = "Your Rank: Backbencher 🎒 (Thoda aur padho)";
            } else {
                message = "Bahut buri performance! 😫";
                rank = "Your Rank: Failure ❌ (Ghar pe daant padegi)";
            }

            document.getElementById("score-details").innerHTML = 
                `<b>${message}</b><br><br>` +
                `<div class="rank-badge">${rank}</div><br><br>` +
                `Aapka Final Score: <b>${score} / ${totalQ}</b>`;
        }
    </script>
</body>
</html>
