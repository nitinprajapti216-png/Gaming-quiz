<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padhai Quiz App</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 10px;
            margin: 0;
        }
        .box {
            background: #222;
            padding: 20px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            margin: 20px auto;
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.1);
        }
        h1 { color: #00ffff; font-size: 26px; }
        #timer-text {
            font-size: 22px;
            color: #ff3333;
            font-weight: bold;
            margin-bottom: 15px;
        }
        button, .nav-btn, .option-btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 15px 0;
            border: 0;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            background: white;
            color: black;
            font-weight: bold;
            box-sizing: border-box;
        }
        button:hover, .nav-btn:hover, .option-btn:hover {
            opacity: .8;
        }
        #result {
            font-size: 24px;
            margin-top: 20px;
        }
        .rank-badge {
            display: inline-block;
            font-size: 24px;
            color: #ff007f;
            font-weight: bold;
            margin-top: 15px;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #ff007f;
        }
        .screen { display: none; }
        .active { display: block; }
        input {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #00ffff;
            background: #333;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        #question {
            font-size: 22px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- HOME SCREEN -->
    <div id="home-screen" class="box screen active">
        <h1>📚 Padhai Quiz App</h1>
        <p style="color: #aaa; font-size: 16px;">Apna khud ka sawaal banayein aur kheliye!</p>
        <button onclick="startQuiz()" style="background: #00ffff; color: black;">🎮 Play Quiz</button>
        <button onclick="showScreen('create-screen')" style="background: #ff007f; color: white;">➕ Create Own Question</button>
    </div>

    <!-- CREATE QUESTION SCREEN -->
    <div id="create-screen" class="box screen">
        <h2 style="color: #ff007f;">➕ Naya Sawaal Banayein</h2>
        <input type="text" id="new-q" placeholder="Apna Sawaal Likhein (e.g. Bharat ke PM kon hai?)">
        <input type="text" id="opt-0" placeholder="Option A">
        <input type="text" id="opt-1" placeholder="Option B">
        <input type="text" id="opt-2" placeholder="Option C">
        <input type="text" id="opt-3" placeholder="Option D">
        <input type="number" id="correct-opt" placeholder="Sahi option ka number (0=A, 1=B, 2=C, 3=D)" min="0" max="3">
        <button onclick="addQuestion()" style="background: #00ffff; color: black;">💾 Save Question</button>
        <button onclick="showScreen('home-screen')" style="background: #aaa; color: black;">⬅ Back</button>
    </div>

    <!-- GAME PLAY SCREEN -->
    <div id="game-screen" class="box screen">
        <div id="timer-text">⏳ Time Left: 15s</div>
        <div id="question">Sawaal yahan aayega...</div>
        <div id="options-container"></div>
        <div id="result"></div>
    </div>

    <!-- SCORE / END SCREEN -->
    <div id="score-screen" class="box screen">
        <div id="score-details"></div>
        <button onclick="showScreen('home-screen')" style="background: #00ffff; color: black; margin-top: 20px;">🔄 Main Menu / Replay</button>
    </div>

    <script>
        // Default base questions list
        const masterQuizData = [
            { q: "Bharat ki Rajdhani kya hai?", options: ["Mumbai", "Delhi", "Kolkata", "Chennai"], correct: 1 },
            { q: "Computer ka brain kise kehte hain?", options: ["RAM", "Hard Disk", "CPU", "Monitor"], correct: 2 }
        ];

        // Custom storage for user questions
        let customQuestions = JSON.parse(localStorage.getItem("myCustomQuestions")) || [];
        let quizData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let timeLeft = 15;
        let timerInterval;

        // Navigation between screens
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // Add custom user question logic
        function addQuestion() {
            const questionText = document.getElementById("new-q").value.trim();
            const opt0 = document.getElementById("opt-0").value.trim();
            const opt1 = document.getElementById("opt-1").value.trim();
            const opt2 = document.getElementById("opt-2").value.trim();
            const opt3 = document.getElementById("opt-3").value.trim();
            const correctIdx = parseInt(document.getElementById("correct-opt").value);

            if (!questionText || !opt0 || !opt1 || !opt2 || !opt3 || isNaN(correctIdx)) {
                alert("Kripya saare fields sahi se bharein!");
                return;
            }

            const newQuestionObj = {
                q: questionText,
                options: [opt0, opt1, opt2, opt3],
                correct: correctIdx
            };

            customQuestions.push(newQuestionObj);
            localStorage.setItem("myCustomQuestions", JSON.stringify(customQuestions));

            alert("Sawaal safaltapurvak jodh diya gaya! 🎉");

            // Clear inputs
            document.getElementById("new-q").value = "";
            document.getElementById("opt-0").value = "";
            document.getElementById("opt-1").value = "";
            document.getElementById("opt-2").value = "";
            document.getElementById("opt-3").value = "";
            document.getElementById("correct-opt").value = "";

            showScreen('home-screen');
        }

        // Start Quiz Game logic
        function startQuiz() {
            // Fix 15 sawaal aur aapke banaye naye sawaal dono ko jodh rahe hain
            quizData = [...masterQuizData, ...customQuestions];

            // Shuffling (Mix karna)
            for (let i = quizData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [quizData[i], quizData[j]] = [quizData[j], quizData[i]];
            }

            currentQuestionIndex = 0;
            score = 0;
            showScreen('game-screen');
            loadQuestion();
        }

        // Load active turn question
        function loadQuestion() {
            document.getElementById("result").innerHTML = "";
            clearInterval(timerInterval);

            if (currentQuestionIndex >= quizData.length) {
                showFinalScore();
                return;
            }

            let currentQuiz = quizData[currentQuestionIndex];
            document.getElementById("question").innerHTML = `${currentQuestionIndex + 1}. ${currentQuiz.q}`;

            let optionsHtml = "";
            currentQuiz.options.forEach((option, index) => {
                optionsHtml += `<button class="option-btn" onclick="checkAnswer(${index})">${option}</button>`;
            });

            document.getElementById("options-container").innerHTML = optionsHtml;

            // Timer management settings
            timeLeft = 15;
            document.getElementById("timer-text").innerHTML = `⏳ Time Left: ${timeLeft}s`;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer-text").innerHTML = `⏳ Time Left: ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    disableButtons();
                    document.getElementById("result").innerHTML = "⏰ Time Out! Agla sawaal aa raha hai...";
                    currentQuestionIndex++;
                    setTimeout(loadQuestion, 2000);
                }
            }, 1000);
        }

        // Turn interactions lockout utility
        function disableButtons() {
            let buttons = document.getElementsByClassName("option-btn");
            for (let button of buttons) {
                button.disabled = true;
                button.style.opacity = "0.6";
                button.style.cursor = "default";
            }
        }

        // Evaluate user choice answer logic
        function checkAnswer(selectedIndex) {
            clearInterval(timerInterval);
            disableButtons();

            let currentQuiz = quizData[currentQuestionIndex];

            if (selectedIndex === currentQuiz.correct) {
                score++;
                document.getElementById("result").innerHTML = "✅ Sahi jawab!";
            } else {
                let correctOptionText = currentQuiz.options[currentQuiz.correct];
                document.getElementById("result").innerHTML = `❌ Galat jawab! Sahi jawab hai: <b>${correctOptionText}</b>`;
            }

            currentQuestionIndex++;
            setTimeout(loadQuestion, 2000);
        }

        // End game state calculation screen layout renderer
        function showFinalScore() {
            showScreen('score-screen');
            
            let massage = ""; 
            let rank = "";
            let totalQ = quizData.length;

            if (score === totalQ) {
