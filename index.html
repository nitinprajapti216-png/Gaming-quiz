<!DOCTYPE html>
<html>
<head>
<title>Padhai Quiz</title>
<style>
body{
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
}
.box{
  background:#222;
  padding:25px;
  border-radius:15px;
  max-width:500px;
  margin:auto;
}
h1{color:#00ffff;}
#timer-text{
  font-size: 20px;
  color: #ff3333;
  font-weight: bold;
  margin-bottom: 10px;
}
button{
  display:block;
  width:100%;
  padding:15px;
  margin:12px 0;
  border:0;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
  background: white;
  color: black;
}
button:hover{opacity:.8;}
#result{
  font-size:22px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="box">
<h1>📚 Padhai Quiz</h1>

<!-- Timer yahan dikhega -->
<p id="timer-text">⏳ Time Left: 20s</p>

<!-- Sawaal yahan dikhega -->
<p id="question" style="font-size: 20px; font-weight: bold;"></p>

<!-- Options ke buttons yahan dynamic tarike se aayenge -->
<div id="options-container"></div>

<!-- Sahi/Galat result aur final score yahan dikhega -->
<p id="result"></p>
</div>

<script>
// Padhai ke 12 zaroori sawaal
const quizData = [
  { q: "Bharat ki rajdhani (Capital) kya hai?", options: ["Mumbai", "Kolkata", "Nai Delhi", "Chennai"], correct: 2 },
  { q: "Ek saal (Year) me kul kitne din hote hain?", options: ["360", "365", "355", "370"], correct: 1 },
  { q: "Hum saans lene ke liye hawa se kaunsi gas lete hain?", options: ["Nitrogen", "Carbon Dioxide", "Hydrogen", "Oxygen"], correct: 3 },
  { q: "Maths: 12 ko 5 se guna (12 x 5) karne par kya milega?", options: ["50", "55", "60", "65"], correct: 2 },
  { q: "Humaare saur mandal (Solar System) ka sabse bada grah kaunsa hai?", options: ["Mangal", "Brihaspati", "Prithvi", "Shani"], correct: 1 },
  { q: "Computer ka dimaag (Brain of Computer) kise kaha jata hai?", options: ["RAM", "CPU", "Mouse", "Keyboard"], correct: 1 },
  { q: "Kangaroo kis desh ka rashtriya pashu (National Animal) hai?", options: ["Australia", "India", "America", "Japan"], correct: 0 },
  { q: "Maths: Agar ek triangle ki 3 sides hain, toh square ki kitni sides hoti hain?", options: ["3", "5", "4", "6"], correct: 2 },
  { q: "Hamare sharir me kul kitni haddiyan (Bones) hoti hain?", options: ["206", "300", "150", "250"], correct: 0 },
  { q: "Paani ka rasayanik sutra (Chemical Formula) kya hai?", options: ["CO2", "H2O", "O2", "NaCl"], correct: 1 },
  { q: "Bharat ka rashtriya pakshi (National Bird) kaunsa hai?", options: ["Kabootar", "Tota", "Mor", "Cheel"], correct: 2 },
  { q: "Ek ghante (1 Hour) me kul kitne seconds hote hain?", options: ["60", "3600", "1200", "2400"], correct: 1 }
];

let currentQuestionIndex = 0;
let score = 0;
let timeLeft = 20;
let timerInterval;

function loadQuestion() {
  document.getElementById("result").innerHTML = "";
  clearInterval(timerInterval); // Purane timer ko rokne ke liye
  
  if (currentQuestionIndex >= quizData.length) {
    showFinalScore();
    return;
  }

  let currentQuiz = quizData[currentQuestionIndex];
  document.getElementById("question").innerHTML = `${currentQuestionIndex + 1}. ${currentQuiz.q}`;
  
  let optionsHtml = "";
  currentQuiz.options.forEach((option, index) => {
    optionsHtml += `<button class="option-btn" onclick="checkAnswer(${index})">${option}</button>`;
  });
  
  document.getElementById("options-container").innerHTML = optionsHtml;
  
  // Timer chalu karein
  timeLeft = 20;
  document.getElementById("timer-text").innerHTML = `⏳ Time Left: ${timeLeft}s`;
  
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById("timer-text").innerHTML = `⏳ Time Left: ${timeLeft}s`;
    
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      disableButtons();
      document.getElementById("result").innerHTML = "⏰ Time Out! Agla sawaal aa raha hai...";
      currentQuestionIndex++;
      setTimeout(loadQuestion, 2000);
    }
  }, 1000);
}

function checkAnswer(selectedIndex) {
  clearInterval(timerInterval); // Jawab dete hi timer ko rok dein
  disableButtons(); // Ek baar click karne ke baad baaki buttons band
  
  let currentQuiz = quizData[currentQuestionIndex];
  
  if (selectedIndex === currentQuiz.correct) {
    score++;
    document.getElementById("result").innerHTML = "✅ Sahi jawab! 🎉";
  } else {
    let correctOptionText = currentQuiz.options[currentQuiz.correct];
    document.getElementById("result").innerHTML = `❌ Galat jawab! Sahi jawab hai: <b>${correctOptionText}</b>`;
  }
  
  currentQuestionIndex++;
  setTimeout(loadQuestion, 2000);
}

function disableButtons() {
  let buttons = document.getElementsByClassName("option-btn");
  for (let button of buttons) {
    button.disabled = true;
    button.style.opacity = "0.6";
    button.style.cursor = "default";
  }
}

function showFinalScore() {
  document.getElementById("timer-text").innerHTML = "";
  document.getElementById("question").innerHTML = "🎉 Quiz Poora Ho Gaya!";
  document.getElementById("options-container").innerHTML = "";
  
  let massage = "";
  if(score === quizData.length) {
    massage = "Shabash! Aapne saare jawab sahi diye! 🥇";
  } else if(score >= 8) {
    massage = "Bahut Achha Prayas! 👍";
  } else {
    massage = "Thoda aur padhne ki zaroorat hai! 📖";
  }

  document.getElementById("result").innerHTML = `<b>${massage}</b><br><br>` +
    `Aapka Final Score: <b>${score} / ${quizData.length}</b><br><br>` + 
    `<button onclick="restartQuiz()" style="background: #00ffff; font-weight: bold;">Dobara Khelein 🔄</button>`;
}

function restartQuiz() {
  currentQuestionIndex = 0;
  score = 0;
  loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
