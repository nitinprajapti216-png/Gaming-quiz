<!DOCTYPE html>
<html>
<head>
<title>Gaming Quiz</title>
<style>
body{
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
}
.box{
  background:#222;
  padding:25px;
  border-radius:15px;
  max-width:500px;
  margin:auto;
}
h1{color:#00ffff;}
button{
  display:block;
  width:100%;
  padding:15px;
  margin:12px 0;
  border:0;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
}
button:hover{opacity:.8;}
#result{
  font-size:22px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="box">
<h1>🎮 Gaming Quiz</h1>

<p id="question">Free Fire game ka malik kaun hai?</p>

<button onclick="answer(false)">A) Krafton</button>
<button onclick="answer(true)">B) Garena</button>

<p id="result"></p>
</div>

<script>
function answer(correct){
  if(correct){
    document.getElementById("result").innerHTML="✅ Sahi jawab! 🎉";
  }else{
    document.getElementById("result").innerHTML="❌ Galat jawab!";
  }
}
</script>

</body>
</html>
